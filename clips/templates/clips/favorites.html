{% extends "clips/layout.html" %}
{% load static %}
{% block title %}My Favorites — Gameplay{% endblock %}

{% block content %}
<div class="page-header">
    <h1>&#9829; My Favorites</h1>
    <p>Clips you've saved for later.</p>
</div>

<div id="clipsGrid" class="clips-grid"></div>
<div id="loadingIndicator" class="loading" style="display:none;">
    <div class="loading-spinner"></div>
</div>
<div id="emptyState" class="empty-state" style="display:none;">
    <p>You haven't favorited any clips yet.</p>
    <a href="{% url 'index' %}" class="btn btn-primary">Browse Clips</a>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'clips/js/clips.js' %}"></script>
<script>
    initFavoritesFeed();
</script>
{% endblock %}
