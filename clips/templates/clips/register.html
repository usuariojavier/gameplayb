{% extends "clips/layout.html" %}
{% block title %}Register — Gameplay{% endblock %}

{% block content %}
<div class="form-container">
    <div class="page-header">
        <h1>Register</h1>
    </div>

    <div class="card">
        <div class="card-body" style="padding:1.5rem;">
            <form method="post" action="{% url 'register' %}">
                {% csrf_token %}
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" name="username" id="username" class="form-control" autofocus required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="confirmation">Confirm Password</label>
                    <input type="password" name="confirmation" id="confirmation" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;">Register</button>
            </form>
            <p style="text-align:center; margin-top:1rem; color:var(--text-muted); font-size:0.9rem;">
                Already have an account? <a href="{% url 'login' %}">Log in here</a>.
            </p>
        </div>
    </div>
</div>
{% endblock %}
